<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Ứng dụng học và ôn tập thông minh với Spaced Repetition">
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LinguaFlash">
    <meta name="application-name" content="LinguaFlash">
    <meta name="msapplication-TileColor" content="#6C63FF">
    <meta name="msapplication-TileImage" content="/icons/icon-144.png">
    
    <title>LinguaFlash - Học Từ Vựng Thông Minh</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="/icons/icon-384.png">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/src/css/variables.css?v=6490fca5fd">
    <link rel="stylesheet" href="/src/css/base.css?v=dfdb69f7f3">
    <link rel="stylesheet" href="/src/css/themes.css?v=4c5f5ad2b9">
    <link rel="stylesheet" href="/src/css/glassmorphism.css?v=56fe2ef15f">
    <link rel="stylesheet" href="/src/css/components.css?v=8d93a524d8">
    <link rel="stylesheet" href="/src/css/animations.css?v=d85022e32b">
    <link rel="stylesheet" href="/src/css/responsive.css?v=5966137dd3">
    <link rel="stylesheet" href="/src/css/pwa-install.css?v=405fffaaab">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-logo">
            <img src="/icons/icon-192.png" alt="LinguaFlash" class="loading-icon" style="width:80px;height:80px;max-width:none;border-radius:16px;">
            <h1>LinguaFlash</h1>
            <p>Đang tải...</p>
        </div>
    </div>

    <!-- Floating Background Icons -->
    <div id="floating-bg" class="floating-bg" aria-hidden="true"></div>

    <!-- App Container -->
    <div id="app" class="app-container">
        <!-- Header -->
        <header id="app-header" class="app-header glass-panel">
            <div class="header-left">
                <button id="btn-menu" class="icon-btn" aria-label="Menu">
                    <span class="material-icons-round">menu</span>
                </button>
                <a href="#/" class="logo-link">
                    <img src="/icons/icon-96.png" alt="LinguaFlash" class="logo-icon" style="width:40px;height:40px;max-width:none;border-radius:8px;">
                    <span class="logo-text">LinguaFlash</span>
                </a>
            </div>
            <div class="header-right">
                <button id="btn-auth" class="icon-btn auth-btn" aria-label="Đăng nhập">
                    <span class="material-icons-round">person</span>
                </button>
                <div id="user-avatar" class="user-avatar" style="display:none;">
                    <img id="avatar-img" src="" alt="Avatar" class="avatar-img">
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Pages will be rendered here by the router -->
        </main>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation Rail -->
    <nav id="sidebar" class="sidebar glass-panel">
        <div class="sidebar-header">
            <span class="sidebar-title">LinguaFlash</span>
            <button class="icon-btn" onclick="Sidebar.collapse()" aria-label="Đóng menu">
                <span class="material-icons-round">close</span>
            </button>
        </div>
        <div id="sidebar-content" class="sidebar-content">
            <!-- Content rendered by Sidebar.js -->
        </div>
    </nav>

    <!-- User Menu Dropdown (hidden by default) -->
    <div id="user-menu" class="dropdown-menu glass-panel" style="display:none;">
        <div class="menu-header">
            <img id="menu-avatar" src="" alt="" class="menu-avatar-img">
            <div class="menu-user-info">
                <p id="menu-user-name" class="menu-user-name">Người dùng</p>
                <p id="menu-user-email" class="menu-user-email">email@example.com</p>
            </div>
        </div>
        <div class="menu-divider"></div>
        <button class="menu-item" data-action="account">
            <span class="material-icons-round">manage_accounts</span>
            <span>Tài khoản</span>
        </button>
        <button class="menu-item" data-action="settings">
            <span class="material-icons-round">settings</span>
            <span>Cài đặt</span>
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item menu-item-danger" data-action="logout">
            <span class="material-icons-round">logout</span>
            <span>Đăng xuất</span>
        </button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

    <!-- App Scripts -->
    <script src="/src/js/firebase-config.js?v=8e275903fb"></script>
    <script src="/src/js/notifications/push-manager.js?v=d663245d4c"></script>
    <script src="/src/js/utils/helpers.js?v=ab1eab05b0"></script>
    <script src="/src/js/utils/tts.js?v=8a686fcd23"></script>
    <script src="/src/js/utils/seed-importer.js?v=465918160a"></script>
    <script src="/src/js/ui/toast.js?v=6cbaf067a2"></script>
    <script src="/src/js/ui/theme.js?v=7d2d8a5c9e"></script>
    <script src="/src/js/ui/background.js?v=35c1280038"></script>
    <script src="/src/js/ui/components.js?v=acf279b70f"></script>
    <script src="/src/js/ui/pwa-install.js?v=53e11ee624"></script>
    <script src="/src/js/ui/sidebar.js?v=6c084ce8e3"></script>
    <script src="/src/js/config/card-schemas.js?v=3bcb6ea2e6"></script>
    <script src="/src/js/config/vocabulary-topics.js?v=aff95fd350"></script>
    <script src="/src/js/utils/family-word-manager.js?v=81ffe0f8ad"></script>
    <script src="/src/js/auth/auth.js?v=cec132f99d"></script>
    <script src="/src/js/auth/auth-ui.js?v=57ee1bc840"></script>
    <script src="/src/js/db/firestore.js?v=ebb0994a1f"></script>
    <script src="/src/js/db/sync.js?v=4128eea52b"></script>
    <script src="/src/js/fsrs/fsrs.js?v=5e348d74b3"></script>
    <script src="/src/js/fsrs/migration.js?v=e9e76603df"></script>
    <script src="/src/js/fsrs/bqt-v2-cleanup.js?v=641201c440"></script>
    <script src="/src/js/fsrs/card-mode-manager.js?v=b9c6aa4d19"></script>
    <script src="/src/js/ui/card-filter.js?v=899debaffc"></script>
    <script src="/src/js/router.js?v=a4c301a082"></script>
    <script src="/src/js/pages/home.js?v=449e7f82f0"></script>
    <script src="/src/js/pages/vocabulary.js?v=2c49695024"></script>
    <script src="/src/js/pages/topic-detail.js?v=d1e3185331"></script>
    <script src="/src/js/pages/grammar.js?v=74990d19f2"></script>
    <script src="/src/js/pages/study.js?v=8fbf55722a"></script>
    <script src="/src/js/pages/review.js?v=0f1399cbca"></script>
    <script src="/src/js/pages/settings.js?v=e44b317cbe"></script>
    <script src="/src/js/pages/account.js?v=0703964c8f"></script>
    <script src="/src/js/pages/auth-page.js?v=c5e3ac19a2"></script>
    <script src="/src/js/pages/languages.js?v=815a9051cd"></script>
    <script src="/src/js/sw-update.js?v=dc43ebc4bb"></script>
    <script src="/src/js/app.js?v=7508f27b53"></script>

    <!-- Service Worker registration & auto-update flow handled by SwUpdate -->
    <script>
        window.addEventListener('load', () => {
            if (window.SwUpdate) SwUpdate.init();
        });
    </script>
</body>
</html>
