<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Ứng dụng học và ôn tập thông minh với Spaced Repetition">
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LinguaFlash">
    
    <title>LinguaFlash - Học Từ Vựng Thông Minh</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/src/css/variables.css?v=5">
    <link rel="stylesheet" href="/src/css/base.css?v=3">
    <link rel="stylesheet" href="/src/css/themes.css?v=2">
    <link rel="stylesheet" href="/src/css/glassmorphism.css?v=2">
    <link rel="stylesheet" href="/src/css/components.css?v=17">
    <link rel="stylesheet" href="/src/css/animations.css?v=2">
    <link rel="stylesheet" href="/src/css/responsive.css?v=4">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-logo">
            <img src="/icons/icon-192.png" alt="LinguaFlash" class="loading-icon" style="width:80px;height:80px;max-width:none;border-radius:16px;">
            <h1>LinguaFlash</h1>
            <p>Đang tải...</p>
        </div>
    </div>

    <!-- Floating Background Icons -->
    <div id="floating-bg" class="floating-bg" aria-hidden="true"></div>

    <!-- App Container -->
    <div id="app" class="app-container">
        <!-- Header -->
        <header id="app-header" class="app-header glass-panel">
            <div class="header-left">
                <button id="btn-menu" class="icon-btn" aria-label="Menu">
                    <span class="material-icons-round">menu</span>
                </button>
                <a href="#/" class="logo-link">
                    <img src="/icons/icon-96.png" alt="LinguaFlash" class="logo-icon" style="width:40px;height:40px;max-width:none;border-radius:8px;">
                    <span class="logo-text">LinguaFlash</span>
                </a>
            </div>
            <div class="header-right">
                <button id="btn-auth" class="icon-btn auth-btn" aria-label="Đăng nhập">
                    <span class="material-icons-round">person</span>
                </button>
                <div id="user-avatar" class="user-avatar" style="display:none;">
                    <img id="avatar-img" src="" alt="Avatar" class="avatar-img">
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Pages will be rendered here by the router -->
        </main>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation Rail -->
    <nav id="sidebar" class="sidebar glass-panel">
        <div class="sidebar-header">
            <span class="sidebar-title">LinguaFlash</span>
            <button class="icon-btn" onclick="Sidebar.collapse()" aria-label="Đóng menu">
                <span class="material-icons-round">close</span>
            </button>
        </div>
        <div id="sidebar-content" class="sidebar-content">
            <!-- Content rendered by Sidebar.js -->
        </div>
    </nav>

    <!-- User Menu Dropdown (hidden by default) -->
    <div id="user-menu" class="dropdown-menu glass-panel" style="display:none;">
        <div class="menu-header">
            <img id="menu-avatar" src="" alt="" class="menu-avatar-img">
            <div class="menu-user-info">
                <p id="menu-user-name" class="menu-user-name">Người dùng</p>
                <p id="menu-user-email" class="menu-user-email">email@example.com</p>
            </div>
        </div>
        <div class="menu-divider"></div>
        <button class="menu-item" data-action="account">
            <span class="material-icons-round">manage_accounts</span>
            <span>Tài khoản</span>
        </button>
        <button class="menu-item" data-action="settings">
            <span class="material-icons-round">settings</span>
            <span>Cài đặt</span>
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item menu-item-danger" data-action="logout">
            <span class="material-icons-round">logout</span>
            <span>Đăng xuất</span>
        </button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="/src/js/firebase-config.js?v=2"></script>
    <script src="/src/js/utils/helpers.js?v=2"></script>
    <script src="/src/js/utils/tts.js?v=1"></script>
    <script src="/src/js/utils/seed-importer.js?v=2"></script>
    <script src="/src/js/ui/toast.js?v=2"></script>
    <script src="/src/js/ui/theme.js?v=2"></script>
    <script src="/src/js/ui/background.js?v=3"></script>
    <script src="/src/js/ui/components.js?v=2"></script>
    <script src="/src/js/ui/sidebar.js?v=6"></script>
    <script src="/src/js/config/card-schemas.js?v=5"></script>
    <script src="/src/js/config/vocabulary-topics.js?v=1"></script>
    <script src="/src/js/utils/family-word-manager.js?v=1"></script>
    <script src="/src/js/auth/auth.js?v=8"></script>
    <script src="/src/js/auth/auth-ui.js?v=3"></script>
    <script src="/src/js/db/firestore.js?v=4"></script>
    <script src="/src/js/db/sync.js?v=2"></script>
    <script src="/src/js/fsrs/fsrs.js?v=2"></script>
    <script src="/src/js/router.js?v=3"></script>
    <script src="/src/js/pages/home.js?v=11"></script>
    <script src="/src/js/pages/vocabulary.js?v=7"></script>
    <script src="/src/js/pages/topic-detail.js?v=2"></script>
    <script src="/src/js/pages/grammar.js?v=1"></script>
    <script src="/src/js/pages/study.js?v=11"></script>
    <script src="/src/js/pages/review.js?v=6"></script>
    <script src="/src/js/pages/settings.js?v=2"></script>
    <script src="/src/js/pages/account.js?v=4"></script>
    <script src="/src/js/pages/auth-page.js?v=8"></script>
    <script src="/src/js/app.js?v=13"></script>

    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.error('[SW] Registration failed:', err));
            });
        }
    </script>
</body>
</html>
